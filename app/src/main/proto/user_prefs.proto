syntax = "proto3";

option java_package = "com.wedgess.luas.data.model";
option java_multiple_files = true;


message UserPreferences {
    string selectedGreenLineStation = 1;
    string selectedRedLineStation = 2;
    bool locationPermissionRequested = 3;
    bool notificationPermissionRequested = 4;
    bool locationPermissionRationaleShown = 5;
    bool ignoreLocationPermission = 6;
    bool ignoreNotificationPermission = 7;
}
