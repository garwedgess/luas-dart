name: Set up Android build
description: Install Java 21 and Android SDK 35, and cache Gradle dependencies.

runs:
  using: composite
  steps:
    - name: Set up Java 21 and Gradle cache
      uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        distribution: temurin
        java-version: '21'
        cache: gradle
        cache-dependency-path: |
          **/*.gradle*
          **/gradle-wrapper.properties
          gradle/libs.versions.toml

    - name: Set up Android SDK
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      with:
        packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
