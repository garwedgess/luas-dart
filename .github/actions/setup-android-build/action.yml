name: Set up Android build
description: Install Java 21 and Android SDK 35, and cache Gradle dependencies and build outputs.

runs:
  using: composite
  steps:
    - name: Set up Java 21
      uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
      with:
        distribution: temurin
        java-version: '21'

    - name: Cache Gradle dependencies and build state
      uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      with:
        cache-read-only: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

    - name: Set up Android SDK
      uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      with:
        packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
