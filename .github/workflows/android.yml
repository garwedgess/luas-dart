name: Android CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and code quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up build tools
        uses: ./.github/actions/setup-android-build

      - name: Check formatting, static analysis, lint and migrations
        run: |
          bash gradlew --no-daemon --stacktrace --continue --max-workers=2 \
            :app:spotlessCheck \
            :app:detekt \
            :app:lintDebug \
            :app:verifySqlDelightMigration

      - name: Save quality reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-quality-reports
          path: |
            app/build/reports/detekt/
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 14

  tests:
    name: Unit tests and JaCoCo
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up build tools
        uses: ./.github/actions/setup-android-build

      - name: Cache Robolectric Android SDKs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ runner.os }}-${{ runner.arch }}-robolectric-v1-${{ hashFiles('gradle/libs.versions.toml', 'app/build.gradle.kts', 'app/src/test/resources/robolectric.properties') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-robolectric-v1-

      - name: Run unit tests and generate JaCoCo coverage
        run: |
          bash gradlew --no-daemon --stacktrace --continue --max-workers=2 \
            :app:testDebugUnitTest \
            :app:jacocoTestDebugUnitTestReport

      - name: Save test results and coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/jacoco/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Save unit-test coverage for Codecov
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-coverage
          path: app/build/reports/jacoco/jacocoTestDebugUnitTestReport/jacocoTestDebugUnitTestReport.xml
          if-no-files-found: error
          retention-days: 7

  build:
    name: APK builds and native checks
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up build tools
        uses: ./.github/actions/setup-android-build

      - name: Build debug and release APKs and verify 16 KB alignment
        run: |
          bash gradlew --no-daemon --stacktrace --continue --max-workers=2 \
            :app:assembleDebug \
            :app:assembleRelease \
            :app:verify16KbNativeLibraries

      - name: Save installable debug APK
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Save unsigned release input for signing
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release-unsigned
          path: app/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: warn
          retention-days: 7

  release:
    name: Sign installable release APK
    needs: [quality, tests, build]
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    steps:
      - name: Check out signing helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up APK signing tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'build-tools;35.0.0'

      - name: Download unsigned release input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-release-unsigned
          path: release-input

      - name: Sign and verify release APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          python3 scripts/sign_release.py \
            --input release-input/app-release-unsigned.apk \
            --output release/app-release.apk

      - name: Save installable signed release APK and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release-signed
          path: |
            release/app-release.apk
            release/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 30

  coverage:
    name: Upload coverage to Codecov
    needs: tests
    # Forks and Dependabot still build and test, without requesting upload credentials.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out coverage metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download unit-test coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unit-test-coverage
          path: coverage

      - name: Upload JaCoCo report
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage/jacocoTestDebugUnitTestReport.xml
          disable_search: true
          flags: unittests
          fail_ci_if_error: true
