name: Android CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and code quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up build tools
        uses: ./.github/actions/setup-android-build

      - name: Check formatting, static analysis, lint and migrations
        run: |
          bash gradlew --no-daemon --stacktrace --continue --max-workers=2 \
            :app:spotlessCheck \
            :app:detekt \
            :app:lintDebug \
            :app:verifySqlDelightMigration

      - name: Save quality reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-quality-reports
          path: |
            app/build/reports/detekt/
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 14

  tests:
    name: Unit tests and JaCoCo
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up build tools
        uses: ./.github/actions/setup-android-build

      - name: Cache Robolectric Android SDKs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ runner.os }}-${{ runner.arch }}-robolectric-v1-${{ hashFiles('gradle/libs.versions.toml', 'app/build.gradle.kts', 'app/src/test/resources/robolectric.properties') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-robolectric-v1-

      - name: Run unit tests and generate JaCoCo coverage
        run: |
          bash gradlew --no-daemon --stacktrace --continue --max-workers=2 \
            :app:testDebugUnitTest \
            :app:jacocoTestDebugUnitTestReport

      - name: Save test results and coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/jacoco/
            app/build/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Save unit-test coverage for Codecov
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-coverage
          path: app/build/reports/jacoco/jacocoTestDebugUnitTestReport/jacocoTestDebugUnitTestReport.xml
          if-no-files-found: error
          retention-days: 7

  build:
    name: APK builds and native checks
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up build tools
        uses: ./.github/actions/setup-android-build

      - name: Build debug and release APKs and verify 16 KB alignment
        run: |
          bash gradlew --no-daemon --stacktrace --continue --max-workers=2 \
            :app:assembleDebug \
            :app:assembleRelease \
            :app:verify16KbNativeLibraries

      - name: Save debug and unsigned release APKs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14

  coverage:
    name: Upload coverage to Codecov
    needs: tests
    # Forks and Dependabot still build and test, without requesting upload credentials.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out coverage metadata
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download unit-test coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: unit-test-coverage
          path: coverage

      - name: Upload JaCoCo report
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage/jacocoTestDebugUnitTestReport.xml
          disable_search: true
          flags: unittests
          fail_ci_if_error: true
