version: 2.1

orbs:
  codecov: codecov/codecov@5.0.3

references:
  ## Cache
  gradle_cache_key: &gradle_cache_key
    key: cache-{{ checksum "build.gradle.kts" }}-{{ checksum "app/build.gradle.kts" }}-{{ checksum "build-logic/convention/build.gradle.kts" }}

  restore_cache: &restore_cache
    restore_cache:
      <<: *gradle_cache_key

  save_cache: &save_cache
    save_cache:
      <<: *gradle_cache_key
      paths:
        - ~/.gradle

  ## Workspace
  workspace: &workspace
    ~/workspace

  attach_debug_workspace: &attach_debug_workspace
    attach_workspace:
      at: *workspace

  persist_debug_workspace: &persist_debug_workspace
    persist_to_workspace:
      root: *workspace
      paths:
        - app/build/intermediates
        - app/build/tmp
        - app/build/outputs/apk
        - app/build/outputs/code-coverage
        - app/build/outputs/unit_test_code_coverage
        - app/build/reports/tests
        - app/build/reports/jacoco
        - app/build/reports/detekt

  persist_reports_workspace: &persist_reports_workspace
    persist_to_workspace:
      root: *workspace
      paths:
        - app/build/reports

  accept_licenses: &accept_licenses
    run:
      name: Accept Licenses
      command: yes | sdkmanager --licenses || exit 0

  ## quality checks

  check_code_quality: &check_code_quality
    run:
      name: Check Code Quality
      command: |
        chmod +x gradlew
        ./gradlew detekt

  jacoco_reporting: &jacoco_reporting
    run:
      name: Generate JaCoCo report
      command: |
        chmod +x gradlew
        ./gradlew jacocoTestDebugUnitTestReport

  lint_check: &lint_check
    run:
      name: Run Lint Inspection
      command: |
        chmod +x gradlew
        ./gradlew lintDebug

  run_unit_test: &run_unit_test
    run:
      name: Run Unit Tests
      command: |
        chmod +x gradlew
        ./gradlew testDebugUnitTest

  upload_reports_to_codecov: &upload_reports_to_codecov
    codecov/upload:
      files: app/build/reports/jacoco/jacocoTestDebugUnitTestReport/jacocoTestDebugUnitTestReport.xml

  build_debug_apk: &build_debug_apk
    run:
      name: Build Debug APK
      command: |
        chmod +x gradlew
        ./gradlew assembleDebug

  store_debug_apk: &store_debug_apk
    store_artifacts:
      path: app/build/outputs/apk/
      destination: apk/

  ## Storing Artifacts
  store_app_reports: &store_app_reports
    store_artifacts:
      name: Storing App Test Reports
      path: app/build/reports
      destination: reports

  store_app_test_results: &store_app_test_results
    store_test_results:
      name: Storing App Test Results
      path: app/build/test-results

executors:
  android-executor:
    docker:
      - image: cimg/android:2024.11
    environment:
      TERM: dumb
      JVM_OPTS: -Xmx2048m
      GRADLE_OPTS: -Xmx2048m -XX:+HeapDumpOnOutOfMemoryError -Dorg.gradle.caching=true -Dorg.gradle.configureondemand=true -Dkotlin.compiler.execution.strategy=in-process -Dkotlin.incremental=false
    working_directory: *workspace

jobs:
  build:
    executor: android-executor
    steps:
      - checkout
      - *restore_cache
      - *accept_licenses
      - *save_cache
      - *build_debug_apk
      - *check_code_quality
      - *lint_check
      - *store_debug_apk

  unit_test:
    executor: android-executor
    steps:
      - checkout
      - *restore_cache
      - *accept_licenses
      - *save_cache
      - *jacoco_reporting
      - *persist_debug_workspace
      - *store_app_reports
      - *store_app_test_results
      - *upload_reports_to_codecov

workflows:
  version: 2
  build_and_test:
    jobs:
      - build:
          filters:
            branches:
              only:
                - develop
                - master
                - /^feature\/.*/
      - unit_test:
          filters:
            branches:
              only:
                - develop
                - master
                - /^feature\/.*/
          requires:
            - build
